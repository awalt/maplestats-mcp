name: Release

# Push a tag like v0.1.0 whose version matches pyproject.toml and server.json
# (tests/test_release.py checks that they agree). Publishes to PyPI, then the
# MCP Registry and a GitHub Release. Or run it by hand on main with the
# version (no "v"): it checks the version, creates the tag on that commit,
# then publishes the same way.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and publish, e.g. 0.4.3"
        required: true
        type: string

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

# Jobs that need more (publishing, releases) ask for it themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the CI check below reads CI's run for this commit
    steps:
      # Full history, so the next step can tell whether the commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.7" # same uv as both Dockerfiles; bump all three together
      - name: A run by hand publishes main only
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      # A pushed v* tag publishes too: refuse one on a commit that never reached main
      # (a tag on a feature branch would otherwise publish untested-on-main code).
      - name: The commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The reruns below are one leg of CI. A v* tag on a commit whose other jobs failed
      # (Python 3.13, 3.14 or 3.15, R and Julia, OCR, the chat, the clients) would still
      # publish, so require CI's own push run on main for this commit to have succeeded.
      # A release started right after the merge finds that run still going, so wait for it
      # (up to 45 minutes; this job keeps GitHub's default 6-hour timeout, which fits).
      # CI's run may not exist yet in the first minutes after the push: keep looking for
      # 5 minutes before saying there is none. On a run by hand GITHUB_SHA is main's tip.
      - name: CI succeeded on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1"
          start=$SECONDS
          while true; do
            # "<status> <conclusion>" of the newest run; "none none" when there is no run.
            # An API error counts as "error" and is retried like a run still going.
            if run=$(gh api "$query" --jq '(.workflow_runs[0] // {}) | "\(.status // "none") \(.conclusion // "none")"'); then
              read -r status conclusion <<< "$run"
            else
              status=error
              conclusion=none
            fi
            [ "$status" = completed ] && break
            if [ "$status" = none ] && [ $((SECONDS - start)) -ge 300 ]; then
              echo "::error::No CI run found for commit $GITHUB_SHA (a push to main) after 5 minutes; release a commit that CI has run on."
              exit 1
            fi
            if [ $((SECONDS - start)) -ge 2700 ]; then
              echo "::error::CI did not finish within 45 minutes for commit $GITHUB_SHA (last status '$status')."
              exit 1
            fi
            echo "CI for ${GITHUB_SHA::7} is '$status'; checking again in 30 seconds."
            sleep 30
          done
          if [ "$conclusion" != success ]; then
            echo "::error::CI ended as '$conclusion' for commit $GITHUB_SHA, not 'success'; release a commit whose CI run on main passed."
            exit 1
          fi
      - run: uv sync --locked
      # The Python 3.12 leg of ci.yml's gate, rerun here on the commit itself. The
      # other jobs run in ci.yml only, and the step above requires them to have passed.
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      - run: uv run pytest -q
      - name: Tag matches the package version
        run: test "${TAG#v}" = "$(uv run python -c 'import maplestats_mcp; print(maplestats_mcp.__version__)')"
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  tag:
    # Only on a run by hand: create the tag on the commit just built and
    # tested. Fails if the tag already exists.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/git/refs"
          -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

  pypi:
    needs: [build, tag]
    # tag is skipped on a tag push; a failed tag stops the publish.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  mcp-registry:
    needs: pypi
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned and checksummed: this job holds an OIDC token, so an unverified
      # "latest" binary could publish anything under our name. To bump, set
      # both values from the release's registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          # From registry_1.8.1_checksums.txt, checked against the downloaded file.
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # PyPI can take a minute to serve a new release's README, which the
      # registry reads to verify ownership (the mcp-name comment).
      - run: sleep 60
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    # The tag's GitHub Release, with notes GitHub writes from the pull
    # requests merged since the previous tag, and the built wheel and sdist
    # attached. pyproject.toml's Changelog link and the site's version line
    # point at these releases.
    needs: pypi
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$TAG"
          --generate-notes
          --verify-tag
