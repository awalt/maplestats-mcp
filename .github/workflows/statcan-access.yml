name: StatCan access

# Since November 2026 Statistics Canada answers some automated requests with a
# Cloudflare check that scripts cannot pass, and which services it checks has
# changed from day to day. Once a day this asks each StatCan service MapleStats
# reads whether it answers a script, writes the table to the run summary, and
# fails when one was blocked or unblocked since docs/findings/statcan-access.json,
# so GitHub emails the repo owner. Record a change with
#   uv run python scripts/smoke_test_statcan_access.py --write
# and commit the file. It only observes: a challenge is reported, never answered.
on:
  schedule:
    # 13:41 UTC: after The Daily's 8:30 ET releases; an off-the-hour minute.
    - cron: "41 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.7" # same uv as both Dockerfiles; bump all three together
      - run: uv sync --locked
      - run: uv run python scripts/smoke_test_statcan_access.py --compare
