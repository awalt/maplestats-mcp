name: Website

# Builds the website from site/ and the server's own tool registry
# (scripts/build_site.py) and publishes it to GitHub Pages. Needs Pages
# enabled once with Settings > Pages > Source: GitHub Actions.
#
# It runs after the CI workflow (ci.yml, name: CI) finishes a push to main,
# and only if CI passed, so a commit that fails lint, types or the tests in
# tests/test_site.py is never published. It builds the exact commit CI
# tested (head_sha), not whatever main points to by then. workflow_run has
# no path filter, so every green push to main rebuilds the site: a change to
# scripts/site_charts.py, pyproject.toml or uv.lock is published as surely as
# one to site/. workflow_dispatch rebuilds the current main by hand.
#
# The Pulse page (site/pulse.html) shows the latest economic figures, so the
# site is also rebuilt every weekday after The Daily's 8:30 ET releases, and
# each build first re-records site/_data/cases/pulse.json through the
# server's own tools. If a source does not answer (StatCan sometimes blocks
# scripts), the step keeps the committed file and the page shows its date.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # 13:47 and 21:47 UTC on weekdays: after The Daily (8:30 ET) and after the
    # Bank of Canada's daily rates (about 16:30 ET); off-the-hour minutes.
    - cron: "47 13,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A pull request whose head branch is also called main triggers
    # workflow_run too; only CI runs for pushes to this repository count.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.7" # same uv as both Dockerfiles; bump all three together
      - run: uv sync --locked
      - name: Refresh the Pulse page's data
        run: uv run python scripts/capture_cases.py pulse || git checkout -- site/_data/cases/pulse.json
      - run: uv run python scripts/build_site.py --out build/site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write  # Pages deployment authenticates with GitHub OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
