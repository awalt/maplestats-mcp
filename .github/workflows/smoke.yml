name: Live smoke tests

# Mocked unit tests cannot see upstream API changes, so the live smoke
# scripts run on a schedule instead. Deliberately not on push or
# pull_request: an upstream outage must never block a merge.
on:
  schedule:
    # Mondays 06:17 UTC; an off-the-hour minute avoids the :00 queue spike.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Same glob as scripts/verify.ps1, so a new smoke_test_*.py is picked
      # up without editing this file. stress_test.py does not match: it is a
      # transport load test, not an upstream check.
      - id: list
        run: |
          scripts=$(ls scripts/smoke_test*.py | xargs -n1 basename | sed 's/\.py$//' | jq -R . | jq -s -c .)
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "$scripts"

  smoke:
    needs: discover
    runs-on: ubuntu-latest
    # smoke_test_modules.py chains many live calls with retries, and
    # smoke_test_arcgis_hub.py walks about 110 portals (15 minutes a pass); the
    # rest finish in a minute or two. 40 leaves room for the workflow's one
    # rerun after either of the long ones fails.
    timeout-minutes: 40
    strategy:
      # One broken upstream must not cancel or hide the others.
      fail-fast: false
      # Keep the load on shared government hosts (several StatCan scripts) polite.
      max-parallel: 8
      matrix:
        script: ${{ fromJSON(needs.discover.outputs.scripts) }}
    name: ${{ matrix.script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.7" # same uv as both Dockerfiles; bump all three together
      - run: uv sync --locked
      # One retry after a pause: of eight failed jobs on 2026-09-26/27, seven
      # were StatCan and portal blips (503, 429, 500, timeouts) that passed
      # on a rerun minutes later. A real upstream change fails both attempts.
      # Exit 75 (scripts/_smoke_common.SKIPPED_EXIT) means the source was down, locked or
      # reloading: reported as a warning and in the job summary, never as a pass and never
      # as a failure that opens the smoke-failure issue. A failure (exit 1) still fails.
      - name: Run ${{ matrix.script }}
        # Unbuffered, so a job cut off at the timeout still shows the last call it
        # made (smoke_test_eccc_coverages printed nothing in 40 minutes on 2026-11-07).
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          run() { uv run python scripts/_run_smoke.py "${{ matrix.script }}" 2>&1 | tee smoke.log; }
          skipped() {
            echo "::warning::${{ matrix.script }} SKIPPED: an upstream source was unavailable"
            { echo "### SKIPPED: \`${{ matrix.script }}\`"; echo '```'; grep -E "^SKIP" smoke.log | head -n 20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # The hosts behind the outage (SKIPHOST lines), for the skipped-hosts job below.
            mkdir -p skipped
            grep -E "^SKIPHOST " smoke.log | awk '{print $2}' | sort -u > "skipped/${{ matrix.script }}.txt" || true
            exit 0
          }
          run && exit 0 || status=$?
          [ "$status" -eq 75 ] && skipped
          echo "::warning::${{ matrix.script }} failed; retrying once in 120s"
          sleep 120
          run && exit 0 || status=$?
          [ "$status" -eq 75 ] && skipped
          exit "$status"
        shell: bash -o pipefail {0}
      - name: Keep the hosts this script skipped for
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-skips-${{ matrix.script }}
          path: skipped/
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "### FAIL: \`${{ matrix.script }}\`"
            echo '```'
            tail -n 40 smoke.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The Maple Test answer keys rebuilt from the live sources. A failure means a
  # person has to look: a published value was revised (population and wages
  # are), or a trap no longer holds (a refused period has been released), or a
  # source moved. The keys' own --check prints which question changed.
  answer-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.7" # same uv as both Dockerfiles; bump all three together
      - run: uv sync --locked
      - name: Check the Maple Test keys against the sources
        run: |
          status=0
          for key in build_key build_key_v2 build_key_v3; do
            echo "== tests.maple_test.$key --check"
            # Exit 75: a source was down after the key's own retries; skipped, not drift.
            uv run python -m "tests.maple_test.$key" --check 2>&1 | tee -a keys.log && continue
            if [ "${PIPESTATUS[0]}" -eq 75 ]; then
              echo "::warning::$key SKIPPED: a source was unavailable"
            else
              status=1
            fi
          done
          exit $status
        shell: bash -o pipefail {0}
      - name: Summarize drift
        if: failure()
        run: |
          {
            echo "### Maple Test answer keys no longer match the sources"
            echo '```'
            grep -v '^\s*$' keys.log | tail -n 40 || echo "(no log captured)"
            echo '```'
            echo "Rebuild the key that drifted, read the diff, and re-grade the runs it affects."
          } >> "$GITHUB_STEP_SUMMARY"

  # A skip never fails a run by itself, so one source that is down all day stays a warning.
  # But a host that took many scripts down (StatCan's www150 answered every automated client
  # with a Cloudflare challenge on 2026-11-17 and a dozen scripts skipped without an alarm), or
  # the same host two runs in a row, is not one source's bad day: this job fails, and the alert
  # job below names the host and its scripts in the smoke-failure issue.
  # scripts/check_skipped_hosts.py has the thresholds.
  skipped-hosts:
    name: skipped hosts
    needs: smoke
    if: ${{ always() && needs.smoke.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: smoke-skips-*
          path: skipped
          merge-multiple: true
      # The latest earlier run that kept its skipped hosts (the first runs after this job
      # was added have none, so nothing counts as a repeat then).
      - name: Fetch the previous run's skipped hosts
        run: |
          mkdir -p previous
          for id in $(gh run list --workflow smoke.yml --status completed --limit 5 \
            --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" --name smoke-skipped-hosts --dir previous 2>/dev/null && break
          done
          ls previous
      - name: Count the scripts skipped for each host
        run: |
          python3 scripts/check_skipped_hosts.py --skips skipped \
            --previous previous/skipped-hosts.json --out report | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -o pipefail {0}
      - name: Keep this run's skipped hosts for the next run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-skipped-hosts
          path: report/skipped-hosts.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep the report for the alert
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-skip-report
          path: report/skip-report.md
          if-no-files-found: ignore
          retention-days: 7

  # Opens one issue per breakage instead of relying on GitHub's default
  # email, which only reaches whoever last edited the cron line. Later
  # failing runs comment on the open issue rather than opening new ones.
  alert:
    needs: [smoke, answer-keys, skipped-hosts]
    if: ${{ always() && (needs.smoke.result == 'failure' || needs.answer-keys.result == 'failure' || needs.skipped-hosts.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: smoke-skip-report
          path: report
      - name: Open or update the smoke-failure issue
        run: |
          # Failed matrix jobs are named after their script; the skipped-hosts job is not one.
          failed=$(gh api --paginate "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" and .name != "skipped hosts") | .name' | sort -u)
          body=$(printf 'Live smoke run failed: %s\n' "$RUN_URL")
          title="Live smoke tests failing ($(date -u +%Y-%m-%d))"
          if [ -n "$failed" ]; then
            body+=$(printf '\nFailing scripts:\n%s\n\nEach job summary shows the last 40 log lines.\n' \
              "$(echo "$failed" | sed 's/^/- `/; s/$/`/')")
          fi
          # Failed only because of the skipped-hosts job: no script failed, a host went dark.
          skips=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure" and .name == "skipped hosts")] | length')
          if [ "$skips" -gt 0 ] && [ -f report/skip-report.md ]; then
            body+=$(printf '\n%s\n' "$(cat report/skip-report.md)")
            if [ -z "$failed" ]; then
              title="Live smoke tests: an upstream host took scripts down ($(date -u +%Y-%m-%d))"
            fi
          fi
          gh label create smoke-failure --color B60205 \
            --description "Scheduled live smoke test found a broken upstream" 2>/dev/null || true
          issue=$(gh issue list --label smoke-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --label smoke-failure --title "$title" --body "$body"
          fi
